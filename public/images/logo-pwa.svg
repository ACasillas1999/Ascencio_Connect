<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark Slate Grey) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f97316" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#orangeGrad)" stroke-width="3" opacity="0.4" />

  <g filter="url(#glowShadow)">
    <!-- Blue Ring (Back Layer) -->
    <circle cx="256" cy="256" r="110" fill="none" stroke="url(#blueGrad)" stroke-width="46" />

    <!-- Orange Interlocking X (Pill Bars) -->
    <!-- Bar 1: Top-Left to Bottom-Right -->
    <rect x="216" y="96" width="80" height="320" rx="40" 
          transform="rotate(-45 256 256)" 
          fill="url(#orangeGrad)" />

    <!-- Bar 2: Bottom-Left to Top-Right -->
    <rect x="216" y="96" width="80" height="320" rx="40" 
          transform="rotate(45 256 256)" 
          fill="url(#orangeGrad)" />

    <!-- Blue Ring Center Hole Overlay for Interlocking Effect -->
    <circle cx="256" cy="256" r="64" fill="#020617" />
    <circle cx="256" cy="256" r="64" fill="none" stroke="url(#blueGrad)" stroke-width="18" />
  </g>

  <!-- Subtle Accent Dots -->
  <circle cx="120" cy="120" r="6" fill="#38bdf8" opacity="0.8" />
  <circle cx="392" cy="392" r="7" fill="#fb923c" opacity="0.8" />
</svg>